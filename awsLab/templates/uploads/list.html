<!doctype html>
<html>
  <body>
    <p>Conectado como {{ user.username }} · <a href="{% url 'logout' %}">Salir</a></p>
    <h1>Archivos subidos</h1>
    <p><a href="{% url 'uploads:upload' %}">Subir otra</a></p>

    <ul>
      {% for item in items %}
        <li>
          <strong>{{ item.title }}</strong>
          ({{ item.original_name }}) —
          <a href="{% url 'uploads:view' item.public_id %}">Ver (URL prefirmada)</a>
          <br>
          <small>S3 key: {{ item.s3_key }}</small>
        </li>
      {% empty %}
        <li>No hay archivos</li>
      {% endfor %}
    </ul>
  </body>
</html>
