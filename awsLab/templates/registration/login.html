<!doctype html>
<html>
  <body>
    <h1>Ingresar</h1>
    {% if form.errors %}
      <p>Usuario o contraseña incorrectos.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Ingresar</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </body>
</html>
